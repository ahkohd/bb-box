# Typecheck and the tests, docs included (#503), on every pull request and push to main.
# They run on the organisation's self-hosted runners, in a fresh Node container per job.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, linux, X64]
    container:
      image: node:26-bookworm
      options: --memory=8g --cpus=8
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
