<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>html,body{margin:0;height:100%;background:#fff;touch-action:none;user-select:none;-webkit-user-select:none}body.dark{background:#000}#busy{position:fixed;left:0;right:0;bottom:0;height:40px;background:#888}</style></head><body><div id="busy"></div>
<script>
const busy = new URLSearchParams(location.search).has("busy");
document.addEventListener("pointerdown", () => document.body.classList.toggle("dark"));
if (busy) { const bar = document.getElementById("busy"); const step = (now) => { bar.style.background = `hsl(${Math.round(now / 4) % 360} 70% 50%)`; requestAnimationFrame(step); }; requestAnimationFrame(step); }
</script></body></html>
