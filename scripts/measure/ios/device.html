<!doctype html><html><head><meta charset="utf-8"><style id="bb-theme"></style><style>html,body{margin:0;background:var(--background,#222);font-family:system-ui,sans-serif;overflow:hidden}#screen{position:relative;width:100vw;height:100vh}.absolute{position:absolute}.inset-0{inset:0}</style></head><body><div id="screen"></div>
<script type="module">
import "./client.js";
const q = new URLSearchParams(location.search);
const THEME_URL = "https://raw.githubusercontent.com/get-bb/bb/desktop-v0.44.0/apps/web/src/components/ui/theme.css";
window.theme = (name) => {
  document.documentElement.classList.toggle("dark", name !== "light");
  document.documentElement.classList.toggle("light", name === "light");
};
window.theme(q.get("theme") ?? "dark");
await fetch(THEME_URL).then((response) => response.text()).then((css) => (document.getElementById("bb-theme").textContent = css.replace(/@theme(?:\s+inline)?\s*\{/g, ":root {"))).catch(() => undefined);
const session = new SelkiesSession(`ws://127.0.0.1:${q.get("socket") ?? 8771}/device`, { device: { model: q.get("model") ?? "iPhone 18 Pro" } });
document.getElementById("screen").appendChild(session.element);
session.setGuest(q.get("guest") ?? "macos");
session.setDeviceView({ frame: q.get("frame") !== "0", pixelForPixel: q.get("pfp") === "1" });
window.view = (frame, pixelForPixel) => session.setDeviceView({ frame, pixelForPixel });
const canvas = session.element.querySelector("canvas");
const sampler = new OffscreenCanvas(1, 1).getContext("2d", { willReadFrequently: true });
const own = () => session.device?.state?.geometry?.video ?? { width: canvas.width, height: canvas.height };
const toCanvas = (x, y) => ({ x: Math.round((x * canvas.width) / own().width), y: Math.round((y * canvas.height) / own().height) });
window.session = session;
window.drawn = [];
window.downs = [];
window.probe = null;
const draw = CanvasRenderingContext2D.prototype.drawImage;
CanvasRenderingContext2D.prototype.drawImage = function (...args) {
  const result = draw.apply(this, args);
  if (this.canvas === canvas) {
    const at = performance.now();
    let shade = -1;
    if (window.probe) {
      const probe = toCanvas(window.probe.x, window.probe.y);
      sampler.drawImage(canvas, probe.x, probe.y, 1, 1, 0, 0, 1, 1);
      const [r, g, b] = sampler.getImageData(0, 0, 1, 1).data;
      shade = Math.round((r + g + b) / 3);
    }
    window.drawn.push([at, shade, canvas.width, canvas.height]);
  }
  return result;
};
canvas.addEventListener("pointerdown", (event) => window.downs.push(event.timeStamp), true);
window.shadeNow = () => {
  if (!window.probe) return -1;
  const probe = toCanvas(window.probe.x, window.probe.y);
  sampler.drawImage(canvas, probe.x, probe.y, 1, 1, 0, 0, 1, 1);
  const [r, g, b] = sampler.getImageData(0, 0, 1, 1).data;
  return Math.round((r + g + b) / 3);
};
window.control = (mine) => session.setControl(mine, false);
window.clientOfVideo = (x, y) => {
  const at = session.deviceStage.toElement({ x, y });
  const rect = session.element.getBoundingClientRect();
  return at ? { x: rect.left + at.x, y: rect.top + at.y } : null;
};
window.videoAt = (clientX, clientY) => session.deviceStage.toVideo(clientX, clientY);
window.pixel = (deviceX, deviceY, radius = 2) => {
  const { x, y } = toCanvas(deviceX, deviceY);
  const size = radius * 2 + 1;
  sampler.canvas.width = size;
  sampler.canvas.height = size;
  sampler.drawImage(canvas, x - radius, y - radius, size, size, 0, 0, size, size);
  const data = sampler.getImageData(0, 0, size, size).data;
  let r = 0, g = 0, b = 0;
  for (let i = 0; i < data.length; i += 4) { r += data[i]; g += data[i + 1]; b += data[i + 2]; }
  const n = data.length / 4;
  return [Math.round(r / n), Math.round(g / n), Math.round(b / n)];
};
window.frameSize = () => ({ width: canvas.width, height: canvas.height, own: own(), drawn: session.deviceStage.drawn });
window.screenRect = () => {
  const rect = canvas.getBoundingClientRect();
  const scale = Math.min(rect.width / canvas.width, rect.height / canvas.height);
  return { left: rect.left + (rect.width - canvas.width * scale) / 2, top: rect.top + (rect.height - canvas.height * scale) / 2, scale, width: canvas.width, height: canvas.height };
};
</script></body></html>
