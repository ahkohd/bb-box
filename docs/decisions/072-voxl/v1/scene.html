<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>scene</title>
<style>
html, body { margin: 0; background: #fff; font: 16px/1.5 "DejaVu Sans", sans-serif; color: #222; }
#marker { position: fixed; left: 0; top: 0; width: 384px; height: 32px; z-index: 10; }
#art { position: fixed; inset: 0; display: none; }
#text { padding: 48px 64px; columns: 3; column-gap: 48px; }
p { margin: 0 0 12px; }
</style>
</head>
<body>
<canvas id="art"></canvas>
<canvas id="marker" width="384" height="32"></canvas>
<div id="text"></div>
<script>
const work = new URLSearchParams(location.search).get("work") ?? "scroll";
const MARKER_BITS = 24;
const BLOCK = 16;
const marker = document.getElementById("marker").getContext("2d");
const drawMarker = (value) => {
  for (let bit = 0; bit < MARKER_BITS; bit++) {
    const one = (value >> bit) & 1;
    marker.fillStyle = one ? "#fff" : "#000";
    marker.fillRect(bit * BLOCK, 0, BLOCK, BLOCK);
    marker.fillStyle = one ? "#000" : "#fff";
    marker.fillRect(bit * BLOCK, BLOCK, BLOCK, BLOCK);
  }
};
const words = "the quick brown fox jumps over the lazy dog while a desktop streams its pixels through a relay to a browser far away and back".split(" ");
let seed = 7;
const random = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
const text = document.getElementById("text");
for (let paragraph = 0; paragraph < 900; paragraph++) {
  const p = document.createElement("p");
  p.textContent = Array.from({ length: 30 + Math.floor(random() * 40) }, () => words[Math.floor(random() * words.length)]).join(" ");
  text.appendChild(p);
}
const art = document.getElementById("art");
const circles = Array.from({ length: 40 }, () => ({ x: random() * 1920, y: random() * 1080, dx: (random() - 0.5) * 24, dy: (random() - 0.5) * 24, r: 30 + random() * 90, hue: Math.floor(random() * 360) }));
if (work === "animation") {
  text.style.display = "none";
  art.style.display = "block";
  art.width = innerWidth;
  art.height = innerHeight;
}
const paint = art.getContext("2d");
let frames = 0;
let second = performance.now();
const scrollStep = 10;
const tick = (now) => {
  drawMarker(Date.now() & 0xffffff);
  if (work === "scroll") {
    if (scrollY + innerHeight + scrollStep >= document.documentElement.scrollHeight) scrollTo(0, 0);
    else scrollBy(0, scrollStep);
  } else if (work === "animation") {
    paint.fillStyle = `hsl(${(now / 20) % 360} 40% 92%)`;
    paint.fillRect(0, 0, art.width, art.height);
    for (const circle of circles) {
      circle.x += circle.dx;
      circle.y += circle.dy;
      if (circle.x < 0 || circle.x > art.width) circle.dx = -circle.dx;
      if (circle.y < 0 || circle.y > art.height) circle.dy = -circle.dy;
      paint.fillStyle = `hsl(${(circle.hue + now / 10) % 360} 70% 50%)`;
      paint.beginPath();
      paint.arc(circle.x, circle.y, circle.r, 0, Math.PI * 2);
      paint.fill();
    }
  }
  frames++;
  if (now - second >= 1000) {
    document.title = `scene ${work} fps=${(frames * 1000 / (now - second)).toFixed(1)}`;
    frames = 0;
    second = now;
  }
  if (work !== "idle") requestAnimationFrame(tick);
};
if (work === "idle") drawMarker(0);
else requestAnimationFrame(tick);
</script>
</body>
</html>
