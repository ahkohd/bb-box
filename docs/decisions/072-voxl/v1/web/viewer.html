<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#222;overflow:hidden}#screen{position:relative;width:100vw;height:100vh}.absolute{position:absolute}.inset-0{inset:0}</style>
</head>
<body>
<div id="screen"></div>
<script type="module">
import "./client.js";
const query = new URLSearchParams(location.search);
const stream = query.get("stream");
const MARKER_BITS = 24;
const BLOCK = 16;
window.markers = [];
window.bytes = [];
window.frameSizes = [];
const RealWebSocket = WebSocket;
window.WebSocket = Object.assign(function (...args) {
  const socket = new RealWebSocket(...args);
  socket.addEventListener("message", (event) => window.bytes.push([Date.now(), event.data.byteLength ?? event.data.length ?? 0]));
  return socket;
}, { CONNECTING: 0, OPEN: 1, CLOSING: 2, CLOSED: 3, prototype: RealWebSocket.prototype });
const strip = new OffscreenCanvas(MARKER_BITS * BLOCK, 2 * BLOCK);
const stripContext = strip.getContext("2d", { willReadFrequently: true });
const readMarker = (canvas) => {
  stripContext.drawImage(canvas, 0, 0, strip.width, strip.height, 0, 0, strip.width, strip.height);
  const pixels = stripContext.getImageData(0, 0, strip.width, strip.height).data;
  const light = (x, y) => pixels[(y * strip.width + x) * 4 + 1] > 127;
  let value = 0;
  for (let bit = 0; bit < MARKER_BITS; bit++) {
    const x = bit * BLOCK + BLOCK / 2;
    const one = light(x, BLOCK / 2);
    if (one === light(x, BLOCK + BLOCK / 2)) return null;
    if (one) value |= 1 << bit;
  }
  return value;
};
const drawImage = CanvasRenderingContext2D.prototype.drawImage;
CanvasRenderingContext2D.prototype.drawImage = function (image, ...rest) {
  const drawn = drawImage.call(this, image, ...rest);
  if (typeof VideoFrame !== "undefined" && image instanceof VideoFrame) {
    const at = Date.now();
    const canvas = this.canvas;
    window.frameSizes.push(`${canvas.width}x${canvas.height}`);
    window.markers.push([at, readMarker(canvas)]);
  }
  return drawn;
};
const screen = document.getElementById("screen");
const route = `ws://${location.host}/bb?box=${query.get("box")}&viewer=${query.get("viewer")}`;
if (stream === "rfb") {
  const rfb = new RFB(screen, route, { shared: true });
  rfb.qualityLevel = 2;
  rfb.compressionLevel = 2;
  rfb.scaleViewport = true;
  rfb.viewOnly = true;
  let connected = false;
  rfb.addEventListener("connect", () => {
    connected = true;
    const display = rfb._display;
    const flip = display.flip.bind(display);
    display.flip = (...args) => {
      const flipped = flip(...args);
      window.frameSizes.push(`${rfb._canvas.width}x${rfb._canvas.height}`);
      window.markers.push([Date.now(), readMarker(rfb._canvas)]);
      return flipped;
    };
  });
  window.connected = () => connected;
} else {
  window.session = new SelkiesSession(`${route}&stream=${stream}`, stream === "voxl" ? { acksEachFrame: true, pastesPngOnly: true } : {});
  screen.appendChild(window.session.element);
  window.connected = () => window.session.connection.state === "connected";
}
window.ready = true;
</script>
</body>
</html>
